name: Phase 1A dependency update

on:
  push:
    branches:
      - codex/implement-backend-for-passwordless-authentication
    paths:
      - .github/workflows/phase1a-deps.yml

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/implement-backend-for-passwordless-authentication
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add maintained auth infrastructure dependencies
        run: |
          pnpm --filter @g64/api add redis nodemailer
          pnpm --filter @g64/api add -D @types/nodemailer

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: add maintained auth infrastructure clients"
          git push origin HEAD:codex/implement-backend-for-passwordless-authentication
