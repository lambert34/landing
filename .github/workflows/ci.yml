name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify lockfile was generated
        run: test -f pnpm-lock.yaml

      - name: Upload pnpm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g64-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
