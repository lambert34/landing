services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: g64
      POSTGRES_USER: g64
      POSTGRES_PASSWORD: g64_dev
    ports: ['5432:5432']
    volumes: [g64_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U g64 -d g64']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: [g64_redis:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['1025:1025', '127.0.0.1:8025:8025']
volumes:
  g64_postgres:
  g64_redis:
